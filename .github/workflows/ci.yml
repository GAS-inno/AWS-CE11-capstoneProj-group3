name: Terraform Infrastructure

on:
  push:
    branches: 
      - "feature/**"
  pull_request:
    branches: 
      - "main"

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5.0"

permissions:
  contents: read
  pull-requests: write

jobs:
  # CI job for feature branches and pull requests - validation and security checks only
  ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Verify Terraform Directory
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing workspace:"
        ls -la
        echo "Checking terraform directory:"
        ls -la terraform/
        echo "Terraform directory exists: $(test -d terraform && echo 'YES' || echo 'NO')"

    - name: Terraform Format Check
      run: cd terraform && terraform fmt -check

    - name: Terraform Init
      run: cd terraform && terraform init

    - name: Terraform Validate
      run: cd terraform && terraform validate

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: latest

    - name: Init TFLint
      run: cd terraform && tflint --init

    - name: Run TFLint
      run: cd terraform && tflint -f compact

    # Temporarily disabled - may be causing path issues
    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        directory: terraform

    - name: Terraform Plan (PR)
      run: cd terraform && terraform plan -no-color -input=false -out=tfplan

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ github.sha }}
        path: terraform/tfplan
        retention-days: 5
 ########################################
  # Add a job for snyk scan of your code #
  ########################################

  snyk-checks:
    runs-on: ubuntu-latest
    needs: ci
    name: Snyk Security Scans
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk version
        run: snyk --version

      - name: Authenticate Snyk CLI
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk Code Test
        run: snyk code test
        continue-on-error: true

      - name: Run Snyk Test
        run: snyk test
        continue-on-error: true

      - name: Run Snyk IaC Test
        run: snyk iac test
        continue-on-error: true

      - name: Publish to Snyk (monitor)
        run: snyk monitor
        continue-on-error: true

  #################################################
  # Finally, update summary for snyk-check        #
  # Update needs statement to include snyk-checks #
  #################################################
  summary:
    needs: [ci, snyk-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Adding markdown
        run: |
          TF_STATUS=${{ needs.ci.result }}
          SNYK_STATUS=${{ needs.snyk-checks.result }}

          echo '## 🚀 Preparing Build Summary 🚀' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          echo "| Job Name        | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| tf-check       | $TF_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| snyk-check     | $SNYK_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          echo '## Job ran by: ${{ github.actor }}' >> $GITHUB_STEP_SUMMARY