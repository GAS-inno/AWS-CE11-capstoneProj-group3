apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-high-booker
  namespace: default
  labels:
    app: sky-high-booker
    environment: ${ENVIRONMENT}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sky-high-booker
  template:
    metadata:
      labels:
        app: sky-high-booker
        environment: ${ENVIRONMENT}
    spec:
      containers:
      - name: sky-high-booker
        image: ${ECR_REPOSITORY_URL}:${ENVIRONMENT}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: VITE_AWS_REGION
          value: "us-east-1"
        - name: VITE_COGNITO_USER_POOL_ID
          value: "${COGNITO_USER_POOL_ID}"
        - name: VITE_COGNITO_CLIENT_ID
          value: "${COGNITO_CLIENT_ID}"
        - name: VITE_API_GATEWAY_URL
          value: "${API_GATEWAY_URL}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sky-high-booker-service
  namespace: default
  labels:
    app: sky-high-booker
spec:
  type: LoadBalancer
  selector:
    app: sky-high-booker
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
